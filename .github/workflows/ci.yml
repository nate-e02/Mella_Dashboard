name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Static checks: fast feedback, no services needed.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma validate/generate read the datasource URL; no connection is made.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run lint
      # `next typegen` (part of the script) generates the global PageProps/LayoutProps route types first.
      - run: npm run typecheck
      - name: Audit production dependencies (fail on critical)
        run: npm audit --omit=dev --audit-level=critical

  # Unit + integration tests against real Postgres and Redis.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mellafx
          POSTGRES_PASSWORD: mellafx
          POSTGRES_DB: mellafx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mellafx -d mellafx_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://mellafx:mellafx@localhost:5432/mellafx_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      APP_URL: http://localhost:3000
      WS_PUBLIC_URL: ws://localhost:4100/ws
      WORKER_INTERNAL_TOKEN: ci-worker-token
      ENABLE_DEV_OVERRIDES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Schema drift check (schema.prisma must match the migrations)
        run: |
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code \
            || { echo "::error::prisma/schema.prisma has changes without a migration. Run: npx prisma migrate dev --name <change>"; exit 1; }
      - run: npm test

  # Production build + real servers + end-to-end trade over the WebSocket.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mellafx
          POSTGRES_PASSWORD: mellafx
          POSTGRES_DB: mellafx_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mellafx -d mellafx_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://mellafx:mellafx@localhost:5432/mellafx_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      # Production boot requires an https APP_URL; requests still go to http://localhost:3000
      # (the CSRF check also accepts the request's own Host).
      APP_URL: https://localhost:3000
      WS_PUBLIC_URL: ws://localhost:4100/ws
      WORKER_INTERNAL_URL: http://localhost:4100
      WORKER_INTERNAL_TOKEN: ci-worker-token
      CHAPA_SECRET_KEY: CHASECK_TEST-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Seed demo data
        run: npx prisma db seed
      - name: Build
        run: npm run build
      - name: Start web (production mode) and trading worker (simulated feed)
        run: |
          # Same artefact the Docker web image runs: the standalone server plus static assets.
          cp -r .next/static .next/standalone/.next/ && cp -r public .next/standalone/
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > web.log 2>&1 &
          SEED_DEFAULT_INSTRUMENTS=true FEED_SOURCES_OVERRIDE=STUB LOG_PRETTY=false NODE_ENV=production nohup npm run worker > worker.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && curl -fsS http://localhost:4100/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::servers did not become healthy"; exit 1
      - name: Page and security-header smoke test
        run: |
          set -e
          for path in / /login /register /rules /faq; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$path")
            echo "$path -> $code"; test "$code" = "200"
          done
          headers=$(curl -sI http://localhost:3000/login)
          echo "$headers" | grep -qi "content-security-policy" || { echo "::error::CSP header missing"; exit 1; }
          echo "$headers" | grep -qi "strict-transport-security" || { echo "::error::HSTS header missing"; exit 1; }
          # Dev-only backdoors must not exist in production.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Origin: http://localhost:3000" http://localhost:3000/api/admin/purchases/x/mark-paid)
          echo "mark-paid -> $code"; test "$code" = "401" -o "$code" = "404"
      - name: End-to-end trade (login, ticks, order, close, ledger)
        run: APP_URL=http://localhost:3000 node scripts/e2e-smoke.mjs
      - name: Server logs
        if: always()
        run: |
          echo "----- web.log -----"; tail -n 200 web.log || true
          echo "----- worker.log -----"; tail -n 200 worker.log || true

  docker:
    runs-on: ubuntu-latest
    needs: [quality, test, e2e]
    if: github.event_name == 'push'
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tags (GHCR requires lower case; tags cannot contain "/")
        id: img
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.target }}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then channel=latest; else channel="branch-${GITHUB_REF_NAME//\//-}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.channel }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Vulnerability scan (fail on fixable critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
